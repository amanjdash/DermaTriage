services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8000
      DERMATRIAGE_CHECKPOINT: /app/ml/models/best_model.pth
      DERMATRIAGE_MC_PASSES: 30
      DERMATRIAGE_MAX_UPLOAD_MB: 10
      DERMATRIAGE_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - ./ml/models:/app/ml/models:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

